name: gate_reco_app
description: Premium Flutter App (Mobile + Web) - Gate Entry & Reconciliation
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------- State Management ----------
  flutter_riverpod: ^2.6.1

  # ---------- Routing ----------
  go_router: ^14.8.1

  # ---------- Networking ----------
  dio: ^5.5.0

  # ---------- Model Generation ----------
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---------- Secure Storage (JWT later) ----------
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.2

  # ---------- File Upload ----------
  file_picker: ^8.1.2

  # ---------- Utilities ----------
  intl: ^0.20.2

  # ---------- UI ----------
  google_fonts: ^8.0.2
  cupertino_icons: ^1.0.8
  universal_html: ^2.3.0
  data_table_2: ^2.7.2
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # ---------- Code Generation ----------
  build_runner: ^2.4.12
  freezed: ^2.5.8
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png

